<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>O Mestre — RPG de Imaginação</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root{
    --ink:#12121a;
    --ink-2:#1b1b26;
    --ink-3:#242032;
    --parchment:#e9dfc4;
    --gold:#b6902e;
    --gold-bright:#d9ac4a;
    --wine:#7a2b3e;
    --hp:#a4384a;
    --estamina:#3d7a8a;
    --line:rgba(182,144,46,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% 0%, #1f2130 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, #23161c 0%, transparent 55%),
      var(--ink);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  @keyframes surgir{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pop{
    0%{ transform:scale(0.7); opacity:0; }
    60%{ transform:scale(1.12); opacity:1; }
    100%{ transform:scale(1); }
  }
  @keyframes brilhoOuro{
    0%,100%{ box-shadow:0 0 0 rgba(217,172,74,0); }
    50%{ box-shadow:0 0 18px rgba(217,172,74,0.55); }
  }
